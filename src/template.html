<!DOCTYPE html>
   <html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>weather webApp/benj</title>
    </head>
    <body>
        <div class="card" id="header">
            <h1>Strato Weather</h1>

            <div id="toggle">
                 <button id="fUnit">Fahrenheit (US)</button>
        <button id="mUnit" class="active">Celcius (Metric)</button>
            </div>
        </div>
        <div class="card">
         <form id="searchForm">
            <legend> Search City</legend>
            <input id="cityInput" placeholder="Search City Name">
            <button type="submit">Search</button>

        </form>
       </div>

       <div id="dataCard">
        <div class="Dcard" id="currWeather">

            <div id="cheader">
                 <h3 class="title">CURRENT WEATHER</h3>
                 <h2 class="slocation">City of Naga, Cebu</h2>
                 <div id="dateTime">
                    <p id="date"></p>
                    <p id="time"></p>
                 </div>
            </div>

            <div id="tempDiv">
                <h2 id="temp"></h2><span class="tempUnit"></span>
            </div>

           <div class="dataS">
             <p id="conditions">C</p>
           </div>

                <div class="dataS">
                     <p id="feelslike">F</p><span class="tempUnit"></span>
                     
                </div>

                <div class="dataS">
                     <p id="humidity">H</p>
                </div>
             
                 <div class="dataS">
                      <p id="windspeed">W</p><span id="windUnit"></span>
                 </div>
              
            

        </div>


        <div class="Dcard" id="forecast">

            <div id="fheader">
                 <h3 class="title">Forecast</h3>
                 <h2 class="slocation">City of Naga, Cebu</h2>
            </div>

    <div id="forecastDays">
        <!-- Forecast cards will be generated here -->
    </div>

</div>
           
        </div>
    </body>
   </html>
